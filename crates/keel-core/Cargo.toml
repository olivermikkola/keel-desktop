[package]
name = "keel-core"
description = "Keel Desktop local agent engine, tools, model catalog, and runtime manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "keel-desktop-cli"
path = "src/bin/keel_desktop_cli.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
pdf-extract = "0.12"
quick-xml = "0.37"
sysinfo = "0.33"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
futures-util = "0.3"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
