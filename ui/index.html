<!doctype html>
<html lang="en" data-accent="sage" data-tone="ink" data-density="cozy" data-text-size="regular">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keel Desktop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar">
        <div class="brand-row">
          <div class="brand-mark-wrap">
            <img src="assets/mark.svg" alt="Keel mark" />
          </div>
          <span class="brand-title">Keel</span>
          <div class="spacer"></div>
          <button id="open-customize-btn" class="icon-btn" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.79 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>

        <button id="new-agent-btn" class="sidebar-new-thread">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New chat</span>
        </button>

        <input id="thread-search" class="sidebar-search" placeholder="Search conversations" aria-label="Search conversations" />

        <nav class="mode-nav" aria-label="Primary Views">
          <button class="mode-nav-item active" data-view="chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
            <span>Chat</span>
          </button>
          <button class="mode-nav-item" data-view="work">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12h18M10 12v3h4v-3"/></svg>
            <span>Work</span>
          </button>
          <button class="mode-nav-item" data-view="code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <span>Code</span>
          </button>
          <button class="mode-nav-item" data-view="library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h5v16H4zm6 0h5v16h-5zm7 1 4 1-3 14-4-1z"/></svg><span>Library</span>
          </button>
          <button class="mode-nav-item" data-view="tools">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17h7m-3.5-3.5v7"/></svg>
            <span>Tools</span>
          </button>
          <button id="open-models-btn" class="mode-nav-item" data-view="models">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
            <span>Models</span>
          </button>
          <button id="open-mcp-btn" class="mode-nav-item" data-view="connectors">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
            <span>Connectors</span>
          </button>
        </nav>

        <div id="apps-list" class="apps-circle-grid" aria-label="Workspace Apps"></div>

        <div class="sidebar-scroll">
          <div class="sidebar-section-header"><span class="sidebar-section-label">Projects</span><button id="new-project-btn" class="text-action" aria-label="New project">+</button></div>
          <div id="projects-list" class="projects-list"></div>
          <div class="sidebar-section-header">
            <span class="sidebar-section-label">Recent</span>
          </div>
          <div id="sessions-list" class="recent-list"></div>
        </div>

        <button id="memory-btn" class="sidebar-memory">Memory <span>↗</span></button>
        <div id="update-banner" class="update-banner hidden" role="status"></div>
        <div id="sidebar-runtime-box" class="sidebar-runtime-box"></div>
      </aside>

      <div class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button id="toggle-sidebar-btn" class="icon-btn" title="Toggle sidebar" aria-label="Toggle sidebar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <line x1="9" y1="4" x2="9" y2="20"></line>
              </svg>
            </button>
            <div class="model-pill-wrap">
              <button id="model-pill-btn" class="model-pill-center" title="Switch AI model" aria-haspopup="menu" aria-expanded="false">
                <span id="runtime-dot" class="status-dot"></span>
                <span id="model-pill-label">Select model</span>
                <svg class="pill-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </button>
              <div id="model-switcher-menu" class="model-switcher-menu hidden" role="menu" aria-label="Switch AI model"></div>
            </div>
            <button id="workspace-pill-btn" class="pill-btn pill-subtle" title="Choose workspace folder">
              <svg class="pill-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              </svg>
              <span id="workspace-pill-label" class="mono">No folder</span>
            </button>
            <button id="harness-pill-btn" class="pill-btn pill-subtle" title="Agent harness">
              <span id="harness-pill-label">Keel</span>
            </button>
          </div>

          <div class="topbar-right">
            <button id="thread-settings-btn" class="icon-btn" title="Conversation settings" aria-label="Conversation settings">⋯</button>
            <button id="diffs-pill-btn" class="pill-btn pill-subtle" title="Review staged file edits">
              <span id="diffs-pill-label">Local only</span>
            </button>
            <button id="publish-pr-btn" class="pill-btn pill-subtle hidden" title="Create branch, commit, and publish PR">
              <span>Publish PR</span>
            </button>
            <button id="toggle-viewer-btn" class="icon-btn" title="Toggle workspace inspector" aria-label="Toggle workspace inspector">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                <line x1="15" y1="4" x2="15" y2="20"></line>
              </svg>
            </button>
            <button id="new-chat-btn" class="icon-btn" title="New chat" aria-label="New chat">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </div>
        </header>

        <!-- Chat / Code Split View -->
        <div id="view-chat-code" class="workspace-body">
          <section class="chat-column">
            <div id="chat-scroll" class="chat-scroll"></div>
            <div id="notice-slot"></div>
            <div id="approval-slot"></div>

            <div class="composer-wrap">
              <div class="composer-box">
                <div id="attachment-chips" class="attachment-chips"></div>
                <textarea
                  id="prompt-input"
                  rows="1"
                  placeholder="Ask anything…"
                ></textarea>
                <div class="composer-bottom-row">
                  <button id="attach-docs-btn" class="icon-btn" aria-label="Attach documents or images" title="Attach PDF, DOCX, text, CSV, or image (offline OCR)">＋</button>
                  <button type="button" id="composer-ws-chip" class="composer-chip mono" title="Choose workspace folder">Open folder</button>
                  <label class="think-chip" title="Toggle model reasoning tokens">
                    <input id="thinking-toggle" type="checkbox" />
                    <span>Think</span>
                  </label>
                  <div class="spacer"></div>
                  <button id="stop-btn" class="composer-circle-btn composer-stop hidden" title="Stop generation" aria-label="Stop generation">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                      <rect x="7" y="7" width="10" height="10" rx="2"></rect>
                    </svg>
                  </button>
                  <button id="send-btn" class="composer-circle-btn composer-send" title="Send message" aria-label="Send message">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <line x1="12" y1="19" x2="12" y2="5"></line>
                      <polyline points="6 11 12 5 18 11"></polyline>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="telemetry-strip">
                <span id="telemetry-left">Local · Zero cloud lock-in</span>
                <span class="telemetry-right-group">
                  <span id="context-meter-pill" class="context-meter-pill mono hidden" title="Conversation memory used. Older turns summarize automatically when full."></span>
                  <span id="telemetry-right" class="mono">Keel v0.7.1</span>
                </span>
              </div>
            </div>
          </section>

          <aside id="viewer-pane" class="viewer-pane hidden">
            <div class="viewer-header">
              <div class="viewer-tabs" role="tablist">
                <button class="viewer-tab active" data-viewer-tab="diff">Diff</button>
                <button class="viewer-tab" data-viewer-tab="code">Code</button>
                <button class="viewer-tab" data-viewer-tab="preview">Preview</button>
              </div>
              <select id="viewer-file-select"></select>
              <button id="refresh-viewer-btn" class="btn btn-ghost btn-sm">Refresh</button>
              <button id="close-viewer-btn" class="icon-btn" aria-label="Close inspector">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                </svg>
              </button>
            </div>
            <div id="viewer-content" class="viewer-content"></div>
          </aside>
        </div>

        <div id="view-library" class="tools-workspace hidden"></div>

        <div id="view-tools" class="tools-workspace hidden"></div>

        <!-- Full Models Workspace View -->
        <div id="view-models" class="models-workspace hidden"></div>

        <!-- Full Connectors Workspace View -->
        <div id="view-connectors" class="connectors-workspace hidden"></div>
      </div>
    </div>

    <div id="global-notice" class="global-notice hidden" role="status"></div>

    <div id="modal-backdrop" class="modal-backdrop hidden">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h2 id="modal-title">Settings</h2>
          <button id="modal-close-btn" class="icon-btn" aria-label="Close modal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
              <line x1="6" y1="6" x2="18" y2="18"></line>
              <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="modal-body" class="modal-body"></div>
      </div>
    </div>

    <!-- First-run welcome and guided setup -->
    <div id="welcome-overlay" class="welcome-overlay hidden" role="dialog" aria-modal="true" aria-label="Welcome to Keel Desktop">
      <svg class="welcome-sail-bg" viewBox="0 0 512 512" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
        <path class="sail-jade" d="M86 460L500 56V312C500 382 320 370 198 418C152 436 116 450 86 460Z"></path>
        <path class="sail-rust" d="M86 460C226 392 346 394 500 426V294C488 378 242 368 86 460Z"></path>
      </svg>

      <div id="welcome-body" class="welcome-desktop-left"></div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
